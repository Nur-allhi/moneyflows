<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MoneyFlows" />
    <meta name="description" content="Personal finance tracker for loans, expenses, and group accounting" />
    <title>MoneyFlows</title>
    <script>
      // Pre-paint theme to avoid a dark flash for light/accent users.
      // Mirrors useTheme(); keep in sync with it.
      try {
        var raw = localStorage.getItem('moneyflows_settings') || '{}';
        var parsed = JSON.parse(raw);
        var st = (parsed.state && parsed.state.settings) || parsed.settings || {};
        var theme = st.theme || 'dark';
        var accent = st.accentId || 'violet';
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.accent = accent;
        document.documentElement.dataset.bg = dark ? (st.bgDark || 'obsidian') : (st.bgLight || 'paper');
        document.documentElement.dataset.font = (st.fontSize === 'small' || st.fontSize === 'large') ? st.fontSize : 'medium';
      } catch (e) { /* defaults apply */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
